<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="OxOY6zS8hNHWoCw7ycplPm">
<head data-page-node-id="xVuJC7k9Se0Q3awzlSDwUn">
<meta charset="utf-8" data-page-node-id="EtXrKsGDTjEG3iOFK8L1mC">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="sOcAeC3Ex6K9o5b0TtB9YK">
<title>授权插件设备</title>
<link rel="stylesheet" href="/tokens.css" data-page-node-id="apO8B8f02bcQ6luc24xNjp">
<style>
  main { max-width: 440px; margin: 10vh auto 0; padding: 0 16px calc(60px + env(safe-area-inset-bottom)); }
  .auth-brand { font-family: var(--font-display); font-size: var(--fs-display); font-weight: 600;
                letter-spacing: .5px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .auth-brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%;
                        background: var(--accent); flex: none; }
  h1 { font-size: var(--fs-h1); font-weight: 600; margin: 0 0 6px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
          padding: 28px 26px; box-shadow: var(--shadow-card); }
  .muted { color: var(--text-2); font-size: var(--fs-small); line-height: 1.6; }
  button { min-height: 44px; padding: 10px 16px; border-radius: var(--radius-ctl);
           border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
           font-size: 14px; cursor: pointer; width: 100%;
           transition: background var(--t-fast), border-color var(--t-fast); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; pointer-events: none; }
  button:active { transform: translateY(1px); }
  .ok { color: var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 8px 12px; }
  .err { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 12px; }
  .row { margin-top: 14px; }
  .devinfo { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-inner);
             padding: 14px 16px; margin-top: 14px; font-size: 14px; line-height: 1.8; }
  .legal { font-size: var(--fs-caption); color: var(--text-2); line-height: 1.7; margin-top: 16px; }
  .okmark { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft);
            display: flex; align-items: center; justify-content: center; margin: 6px auto 14px;
            animation: pop .45s var(--ease); }
  .okmark svg { animation: pop .55s var(--ease); }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); }
                   100% { transform: scale(1); opacity: 1; } }
  .ok-title { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 600;
              text-align: center; margin-bottom: 6px; }
</style>
</head>
<body data-page-node-id="4GNgKly6XKH3Bjx1sIQhdT">
<main data-page-node-id="ZNEAzFtgnYpozhoFKPECrq">
  <div class="auth-brand" data-page-node-id="YmH8GDiAYAuaAIuopwCZwW">知识收件箱</div>
  <div class="card" data-page-node-id="6oJKU5RcFJIh8qFmHhG1uE">
    <h1 data-page-node-id="HqVWukq9HOOMI3UNYV36W5">授权插件设备</h1>
    <div id="state" class="muted" data-page-node-id="PDD2qsoBtCsjXR8ivTOsgR">加载中…</div>
    <div class="row" data-page-node-id="Pt5zpGfyM1UEFLFHFlZuEf"><button class="primary" id="approveBtn" hidden data-page-node-id="9JLoeMIzHzYooJCGsm3YK8">登录此插件</button></div>
    <div class="row" data-page-node-id="zkxwKSef1nzaZ7w39ducKK"><button id="cancelBtn" hidden data-page-node-id="UuTP3T07sXLE6PXVBk8dhq">取消</button></div>
    <p class="legal" data-page-node-id="a6qXFFSqcK884GnY4mMkHZ">确认这是你本人操作：批准后，该插件将获得与你当前统一账号绑定的同步凭据。
      只有此页面能完成授权；插件本身接触不到浏览器登录态。</p>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const requestId = new URLSearchParams(window.location.search).get("request_id") || "";

function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)kb_csrf=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function setState(html) { $("state").innerHTML = html; }

async function goLogin() {
  // 未登录：跳中心登录，回来继续授权
  window.location.href = "/login?next=" + encodeURIComponent("/authorize?request_id=" + encodeURIComponent(requestId));
}

async function refresh() {
  if (!requestId || requestId.length !== 32) {
    setState('<span class="err">授权链接无效：请在插件中重新点击「登录账号」。</span>');
    return;
  }
  let info;
  try {
    info = await fetch("/v1/auth/device/info?request_id=" + encodeURIComponent(requestId),
                       { credentials: "same-origin" }).then((r) => r.json());
  } catch (e) {
    setState('<span class="err">加载失败，请刷新重试。</span>');
    return;
  }
  if (info.error || !info.device_name) {
    setState('<span class="err">授权请求不存在或已过期：请在插件中重新发起。</span>');
    return;
  }
  if (info.state !== "pending") {
    setState('<span class="err">该请求当前状态为 ' + info.state + '：请在插件中重新发起。</span>');
    return;
  }
  // 探测登录：有效会话可直接批准；401 则先登录
  try {
    const me = await fetch("/v1/auth/me", { credentials: "same-origin" });
    if (me.status === 503) {
      setState('<span class="err">认证服务暂不可用，请稍后刷新重试。</span>');
      return;
    }
    if (!me.ok) { await goLogin(); return; }
    const body = await me.json();
    setState('<div class="devinfo">设备名称　<b>' + info.device_name + '</b><br>当前账号　<b>' +
      (body.central_username || body.display_name || "") + '</b><br>' +
      '<span class="muted">批准后插件将以该账号同步。</span>' +
      (info.requests_local_key_binding
        ? '<div class="ok" style="margin-top:10px">该设备还申请了「将此 Key 配置到本设备」权限：' +
          '批准后，你在插件中选择复用的线上模型 Key 会下发到这台设备，用于本地直接调用模型服务。</div>'
        : "") + "</div>");
    $("approveBtn").hidden = false;
    $("cancelBtn").hidden = false;
  } catch (e) {
    await goLogin();
  }
}

$("approveBtn").addEventListener("click", async () => {
  $("approveBtn").disabled = true;
  try {
    const res = await fetch("/v1/auth/device/approve", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ request_id: requestId }),
    });
    const data = await res.json();
    if (!res.ok) {
      setState('<span class="err">' + (data.error?.message || "批准失败") + '</span>');
      $("approveBtn").disabled = false;
      return;
    }
    setState('<div class="okmark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" ' +
      'stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<div class="ok-title">可以回到 Obsidian 了</div>' +
      '<div class="muted" style="text-align:center">已批准授权，插件会自动完成登录。</div>');
    $("approveBtn").hidden = true;
    $("cancelBtn").hidden = true;
  } catch (e) {
    setState('<span class="err">网络错误，请重试。</span>');
    $("approveBtn").disabled = false;
  }
});

$("cancelBtn").addEventListener("click", async () => {
  try {
    await fetch("/v1/auth/device/cancel", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ request_id: requestId }),
    });
  } catch (e) { /* 页面即将无用 */ }
  setState("已取消。请回到插件重新发起。");
  $("approveBtn").hidden = true;
  $("cancelBtn").hidden = true;
});

refresh();
</script>
</body>
</html>
