<!DOCTYPE html>
<html lang="zh-CN" data-theme="rose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授权插件设备</title>
<link rel="preload" as="font" type="font/woff2" crossorigin href="/webstatic/fonts/jr-serif.woff2">
<link rel="stylesheet" href="/webstatic/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<style>
  /* U-10：10vh 固定上边距改为 clamp，矮视口/横屏下卡片不被顶出视口 */
  main { max-width: 440px; margin: 0 auto;
         padding: clamp(24px, 8vh, 72px) 16px calc(60px + env(safe-area-inset-bottom)); }
  .auth-brand { font-family: var(--font-display); font-size: var(--fs-display); font-weight: 600;
                letter-spacing: .5px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .auth-brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%;
                        background: var(--accent); flex: none; }
  h1 { font-size: var(--fs-h1); font-weight: 600; margin: 0 0 6px; }
  /* .card 基础样式来自 tokens.css 共用组件层（docs/15 U-05）；本页只覆写内边距 */
  .card { padding: 28px 26px; }
  .muted { color: var(--text-2); font-size: var(--fs-small); line-height: 1.6; }
  /* 按钮基础样式（44px 触控、hover 边框、U-06 主按钮文字色）来自 tokens.css；本页仅加满宽 */
  button { width: 100%; }
  .ok { color: var(--ok); background: var(--ok-soft); border-radius: var(--radius-note); padding: 8px 12px; }
  .err { color: var(--bad); background: var(--bad-soft); border-radius: var(--radius-note); padding: 8px 12px; }
  .hint-ok { margin-top: 10px; }  /* U-11：原内联 style 抽成类 */
  .row { margin-top: 14px; }
  .devinfo { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-inner);
             padding: 14px 16px; margin-top: 14px; font-size: 14px; line-height: 1.8; }
  .legal { font-size: var(--fs-caption); color: var(--text-2); line-height: 1.7; margin-top: 16px; }
  .okmark { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft);
            display: flex; align-items: center; justify-content: center; margin: 6px auto 14px;
            animation: pop .45s var(--ease); }
  .okmark svg { animation: pop .55s var(--ease); }
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); }
                   100% { transform: scale(1); opacity: 1; } }
  .ok-title { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 600;
              text-align: center; margin-bottom: 6px; }
  .ok-sub { text-align: center; }
  /* 响应式（docs/15 走查小结：授权页会在手机上打开，至少补 520 档） */
  @media (max-width: 520px) {
    main { padding-left: 14px; padding-right: 14px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<main>
  <div class="auth-brand">金蔷薇</div>
  <div class="card">
    <h1>授权插件设备</h1>
    <div id="state" class="muted">加载中…</div>
    <div class="row"><button class="primary" id="approveBtn" hidden>登录此插件</button></div>
    <div class="row"><button id="cancelBtn" hidden>取消</button></div>
    <p class="legal">确认这是你本人操作：批准后，该插件将获得与你当前统一账号绑定的同步凭据。
      只有此页面能完成授权；插件本身接触不到浏览器登录态。</p>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const requestId = new URLSearchParams(window.location.search).get("request_id") || "";

function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)kb_csrf=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : "";
}

function setState(html) { $("state").innerHTML = html; }
// 服务端回来的文本一律先过 esc()：设备名由插件自由填写（≤120），
// 这一页正文是「确认本人操作」的安全提示，被注入即失效（审查 C-04）
function setText(text) { $("state").textContent = text; }

async function goLogin() {
  // 未登录：跳中心登录，回来继续授权
  window.location.href = "/login?next=" + encodeURIComponent("/authorize?request_id=" + encodeURIComponent(requestId));
}

// U-12：状态机标识映射为用户可读文案，未知状态给通用提示，不暴露内部值
const DEVICE_STATE_TEXT = {
  pending: "等待批准", approved: "已批准", consumed: "已完成授权",
  cancelled: "已取消", expired: "已过期", denied: "已拒绝",
};

async function refresh() {
  // 长度不在这页判定：无效/过长的 request_id 由服务端返回不存在，前端不再复述协议细节
  if (!requestId) {
    setState('<span class="err">授权链接无效：请在插件中重新点击「登录账号」。</span>');
    return;
  }
  let info;
  try {
    info = await fetch("/v1/auth/device/info?request_id=" + encodeURIComponent(requestId),
                       { credentials: "same-origin" }).then((r) => r.json());
  } catch (e) {
    setState('<span class="err">加载失败，请刷新重试。</span>');
    return;
  }
  if (info.error || !info.device_name) {
    setState('<span class="err">授权请求不存在或已过期：请在插件中重新发起。</span>');
    return;
  }
  if (info.state !== "pending") {
    const stateText = DEVICE_STATE_TEXT[info.state] || "状态已变化";
    setState('<span class="err">该请求' + stateText + '：请在插件中重新发起。</span>');
    return;
  }
  // 探测登录：有效会话可直接批准；401 则先登录
  try {
    const me = await fetch("/v1/auth/me", { credentials: "same-origin" });
    if (me.status === 503) {
      setState('<span class="err">认证服务暂不可用，请稍后刷新重试。</span>');
      return;
    }
    if (!me.ok) { await goLogin(); return; }
    const body = await me.json();
    setState('<div class="devinfo">设备名称　<b>' + esc(info.device_name) + '</b><br>当前账号　<b>' +
      esc(body.central_username || body.display_name || "") + '</b><br>' +
      '<span class="muted">批准后插件将以该账号同步。</span>' +
      (info.requests_local_key_binding
        ? '<div class="ok hint-ok">该设备还申请了「将此 Key 配置到本设备」权限：' +
          '批准后，你在插件中选择复用的线上模型 Key 会下发到这台设备，用于本地直接调用模型服务。</div>'
        : "") + "</div>");
    $("approveBtn").hidden = false;
    $("cancelBtn").hidden = false;
  } catch (e) {
    await goLogin();
  }
}

$("approveBtn").addEventListener("click", async () => {
  $("approveBtn").disabled = true;
  try {
    const res = await fetch("/v1/auth/device/approve", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ request_id: requestId }),
    });
    const data = await res.json();
    if (!res.ok) {
      setState('<span class="err">' + esc(data.error?.message || "批准失败") + '</span>');
      $("approveBtn").disabled = false;
      return;
    }
    setState('<div class="okmark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" ' +
      'stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<div class="ok-title">可以回到 Obsidian 了</div>' +
      '<div class="muted ok-sub">已批准授权，插件会自动完成登录。</div>');
    $("approveBtn").hidden = true;
    $("cancelBtn").hidden = true;
  } catch (e) {
    setState('<span class="err">网络错误，请重试。</span>');
    $("approveBtn").disabled = false;
  }
});

$("cancelBtn").addEventListener("click", async () => {
  try {
    await fetch("/v1/auth/device/cancel", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
      body: JSON.stringify({ request_id: requestId }),
    });
  } catch (e) { /* 页面即将无用 */ }
  setText("已取消。请回到插件重新发起。");
  $("approveBtn").hidden = true;
  $("cancelBtn").hidden = true;
});

refresh();
</script>
</body>
</html>
