[project]
name = "kbserver"
version = "0.1.0"
description = "个人知识摄入系统：可靠接收、云端加工、本地入库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # MCP server（docs/25）：2.x 是 dual-era 服务，dsh 内置的 TS SDK 客户端协商到
    # 2025-11-25 实测可用（Phase 0b）；不要升 3.x，那条线会移除 initialize 握手兼容
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
