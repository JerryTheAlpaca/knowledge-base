    <linearGradient id="rsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#fff4dd" stop-opacity=".02"/>
      <stop offset=".5" stop-color="#fff8e8" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#fff4dd" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
