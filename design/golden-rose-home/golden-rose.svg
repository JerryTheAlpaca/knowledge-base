      <stop offset=".32" stop-color="#fff0cf" stop-opacity=".84"/>
      <stop offset=".68" stop-color="#e9c995" stop-opacity=".62"/>
      <stop offset="1" stop-color="#a06e40" stop-opacity=".12"/>
