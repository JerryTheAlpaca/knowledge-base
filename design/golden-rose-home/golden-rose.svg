  <style>
    .sheenRect { transform: translateX(-700px); }
    .play .plant { transform-box: view-box; transform-origin: 50% 50%; animation: swayOnce 2s ease-in-out 1 both; }
    @keyframes swayOnce { 0% { transform: rotate(0); } 32% { transform: rotate(-1.5deg); } 68% { transform: rotate(1deg); } 100% { transform: rotate(0); } }
    .play .sheenRect { animation: sheenOnce 1.5s ease-in-out .18s 1 both; }
    @keyframes sheenOnce { from { transform: translateX(-700px); } to { transform: translateX(700px); } }
    .play .glowPulse { transform-box: fill-box; transform-origin: center; animation: glowOnce 1.8s ease-in-out 1 both; }
    @keyframes glowOnce { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle class="glowPulse" cx="300" cy="260" r="172" fill="url(#rglow)"/>
  <g class="plant" filter="url(#rshadow)">
    <g transform="translate(300 260)">
      <g transform="scale(.96)">
        <use href="#outerPetalA" transform="rotate(-5) scale(1.06 1.03)"/>
        <use href="#outerPetalB" transform="rotate(34) scale(1.03 .96)"/>
        <use href="#outerPetalA" transform="rotate(75) scale(.96 1.06)"/>
        <use href="#outerPetalB" transform="rotate(116) scale(1.08 .98)"/>
        <use href="#outerPetalA" transform="rotate(158) scale(.98 1.04)"/>
        <use href="#outerPetalB" transform="rotate(199) scale(1.07 .94)"/>
        <use href="#outerPetalA" transform="rotate(239) scale(.95 1.08)"/>
        <use href="#outerPetalB" transform="rotate(281) scale(1.05 .97)"/>
        <use href="#outerPetalA" transform="rotate(322) scale(1.01 1.04)"/>
      </g>
      <g transform="rotate(11) scale(.83)">
        <use href="#midPetalA" transform="rotate(0) scale(1.08 1.04)"/>
        <use href="#midPetalB" transform="rotate(46) scale(.99 1.09)"/>
        <use href="#midPetalA" transform="rotate(91) scale(1.07 .96)"/>
        <use href="#midPetalB" transform="rotate(137) scale(.97 1.08)"/>
        <use href="#midPetalA" transform="rotate(182) scale(1.05 1)"/>
        <use href="#midPetalB" transform="rotate(228) scale(1.02 1.06)"/>
        <use href="#midPetalA" transform="rotate(274) scale(.96 1.08)"/>
        <use href="#midPetalB" transform="rotate(319) scale(1.08 .98)"/>
      </g>
      <g transform="rotate(27) scale(.48)">
