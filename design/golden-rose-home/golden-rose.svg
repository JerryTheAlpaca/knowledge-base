      <path d="M-36-65 C-26-75-14-79-4-73 C4-81 16-82 25-75 C32-70 35-62 34-54 C44-60 57-55 62-45" fill="none" stroke="url(#rimLight)" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="centerPetal">
      <path d="M0 7 C-9 8-15 2-15-7 C-15-17-9-26 0-30 C7-29 11-23 11-16 C17-20 24-17 25-10 C26-1 14 6 0 7Z" fill="url(#goldCenter)" stroke="#75482d" stroke-opacity=".46" stroke-width="1"/>
      <path d="M-1-29 C6-29 11-23 11-16 C17-20 23-17 25-10" fill="none" stroke="url(#rimLight)" stroke-width="1.8" stroke-linecap="round"/>
