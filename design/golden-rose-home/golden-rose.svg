<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 540 460" role="img" aria-label="金蔷薇">
  <title>金蔷薇</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd873" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#e8a93c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8a93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a2c07"/>
      <stop offset="100%" stop-color="#8a5c12"/>
    </linearGradient>
    <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7a4a0c"/>
      <stop offset="45%" stop-color="#c8891b"/>
      <stop offset="100%" stop-color="#edb940"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8f5c12"/>
      <stop offset="50%" stop-color="#d9a337"/>
      <stop offset="100%" stop-color="#ffd976"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a06a15"/>
      <stop offset="55%" stop-color="#f0c253"/>
      <stop offset="100%" stop-color="#ffedaa"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#fff8dc" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#fffdf2" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#fff8dc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#2f1c04" stop-opacity="0"/>
      <stop offset="76%" stop-color="#2f1c04" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2f1c04" stop-opacity="0.38"/>
    </radialGradient>
    <path id="petal" d="M0 0 C -68 -26 -90 -96 -62 -144 C -50 -170 -30 -184 -13 -182 Q 0 -174 13 -182 C 30 -184 50 -170 62 -144 C 90 -96 68 -26 0 0 Z" vector-effect="non-scaling-stroke"/>
    <path id="cup" d="M-24 -6 C -28 -22 -16 -34 0 -34 C 16 -34 28 -22 24 -6 C 16 -18 8 -23 0 -23 C -8 -23 -16 -18 -24 -6 Z" vector-effect="non-scaling-stroke"/>
    <path id="star" d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z"/>
    <path id="star2" d="M0 -4.6 L1.1 -1.1 L4.6 0 L1.1 1.1 L0 4.6 L-1.1 1.1 L-4.6 0 L-1.1 -1.1 Z"/>
    <clipPath id="bloomClip"><circle cx="300" cy="228" r="186"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <style>
    .plant { transform-box: view-box; transform-origin: 300px 386px; animation: sway 7s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
    .sheenRect { animation: sheenMove 5.6s linear infinite; }
    @keyframes sheenMove { from { transform: translateX(-640px); } to { transform: translateX(640px); } }
    .glowPulse { animation: gpulse 6s ease-in-out infinite alternate; }
    @keyframes gpulse { from { opacity: .8; } to { opacity: 1; } }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .spark:nth-of-type(2n) { animation-delay: -1.1s; animation-duration: 4.2s; }
    .spark:nth-of-type(3n) { animation-delay: -2.2s; animation-duration: 3.7s; }
    @keyframes twinkle { 0%, 100% { opacity: .12; transform: scale(.55); } 50% { opacity: .95; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- 环境光晕 -->
  <ellipse class="glowPulse" cx="300" cy="228" rx="268" ry="222" fill="url(#glow)"/>

  <g id="plant" class="plant">
    <!-- 花冠 -->
    <g transform="translate(300 228) scale(1 0.94)">
      <g fill="url(#gBack)" stroke="#3a2306" stroke-width="2" stroke-linejoin="round" opacity="0.97">
        <use href="#petal" transform="rotate(15) scale(0.92 1.08)"/>
        <use href="#petal" transform="rotate(75) scale(0.92 1.05)"/>
        <use href="#petal" transform="rotate(135) scale(0.92 1.1)"/>
        <use href="#petal" transform="rotate(195) scale(0.92 1.06)"/>
        <use href="#petal" transform="rotate(255) scale(0.92 1.09)"/>
        <use href="#petal" transform="rotate(315) scale(0.92 1.05)"/>
      </g>
      <g fill="url(#gOuter)" stroke="#4a2d06" stroke-width="2" stroke-linejoin="round">
        <use href="#petal" transform="rotate(4) scale(0.88 1.05)"/>
        <use href="#petal" transform="rotate(62) scale(0.88 0.98)"/>
        <use href="#petal" transform="rotate(124) scale(0.88 1.08)"/>
        <use href="#petal" transform="rotate(181) scale(0.88 0.97)"/>
        <use href="#petal" transform="rotate(243) scale(0.88 1.04)"/>
        <use href="#petal" transform="rotate(304) scale(0.88 1.0)"/>
      </g>
      <g fill="#332005" opacity="0.34">
        <use href="#petal" transform="translate(0 7) rotate(33) scale(0.9 0.72)"/>
        <use href="#petal" transform="translate(0 7) rotate(102) scale(0.9 0.74)"/>
        <use href="#petal" transform="translate(0 7) rotate(171) scale(0.9 0.72)"/>
        <use href="#petal" transform="translate(0 7) rotate(240) scale(0.9 0.74)"/>
        <use href="#petal" transform="translate(0 7) rotate(309) scale(0.9 0.72)"/>
      </g>
      <g fill="url(#gMid)" stroke="#5a3709" stroke-width="2" stroke-linejoin="round">
        <use href="#petal" transform="rotate(33) scale(0.9 0.72)"/>
        <use href="#petal" transform="rotate(102) scale(0.9 0.74)"/>
        <use href="#petal" transform="rotate(171) scale(0.9 0.72)"/>
        <use href="#petal" transform="rotate(240) scale(0.9 0.74)"/>
        <use href="#petal" transform="rotate(309) scale(0.9 0.72)"/>
      </g>
      <g fill="#2a1a04" opacity="0.36">
        <use href="#petal" transform="translate(0 6) rotate(68) scale(0.92 0.5)"/>
        <use href="#petal" transform="translate(0 6) rotate(148) scale(0.92 0.52)"/>
        <use href="#petal" transform="translate(0 6) rotate(218) scale(0.92 0.5)"/>
        <use href="#petal" transform="translate(0 6) rotate(298) scale(0.92 0.52)"/>
      </g>
      <g fill="url(#gInner)" stroke="#5a3709" stroke-width="2" stroke-linejoin="round">
        <use href="#petal" transform="rotate(68) scale(0.92 0.5)"/>
        <use href="#petal" transform="rotate(148) scale(0.92 0.52)"/>
        <use href="#petal" transform="rotate(218) scale(0.92 0.5)"/>
        <use href="#petal" transform="rotate(298) scale(0.92 0.52)"/>
      </g>
      <!-- 花心：卷曲花瓣 + 螺旋 -->
      <g transform="translate(0 6)">
        <g fill="url(#gMid)" stroke="#4a2d06" stroke-width="2" stroke-linejoin="round">
          <use href="#cup"/>
          <use href="#cup" transform="rotate(120)"/>
          <use href="#cup" transform="rotate(240)"/>
        </g>
        <g fill="url(#gInner)" stroke="#4a2d06" stroke-width="2" stroke-linejoin="round">
          <use href="#cup" transform="rotate(60) scale(0.62)"/>
          <use href="#cup" transform="rotate(180) scale(0.62)"/>
          <use href="#cup" transform="rotate(300) scale(0.62)"/>
        </g>
        <circle r="10" fill="url(#gInner)" stroke="#6b420d" stroke-width="2"/>
        <path d="M0 0 c -5 0 -8 4 -8 8 c 0 6 5 10 11 10 c 8 0 14 -7 14 -16 c 0 -11 -9 -19 -20 -19" fill="none" stroke="#6b420d" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <circle cx="-3" cy="-4" r="3" fill="#fffbe8" opacity=".9" filter="url(#soft)"/>
      </g>
    </g>

    <ellipse cx="300" cy="228" rx="195" ry="182" fill="url(#rim)"/>
    <g filter="url(#soft)" fill="#fffbe8">
      <ellipse cx="238" cy="126" rx="16" ry="7" opacity="0.55" transform="rotate(-32 238 126)"/>
      <ellipse cx="358" cy="118" rx="13" ry="6" opacity="0.5" transform="rotate(28 358 118)"/>
      <ellipse cx="300" cy="72" rx="10" ry="5" opacity="0.45" transform="rotate(-4 300 72)"/>
    </g>

    <!-- 光泽扫过 -->
    <g clip-path="url(#bloomClip)">
      <g transform="rotate(18 300 228)">
        <rect class="sheenRect" x="244" y="10" width="112" height="440" fill="url(#sheen)"/>
      </g>
    </g>
  </g>

  <!-- 金芒闪烁 -->
  <g fill="#ffedb0">
    <use class="spark" href="#star" x="146" y="94"/>
    <use class="spark" href="#star2" x="456" y="124"/>
    <use class="spark" href="#star" x="108" y="262"/>
    <use class="spark" href="#star2" x="480" y="298"/>
    <use class="spark" href="#star2" x="216" y="40"/>
    <use class="spark" href="#star" x="400" y="44"/>
  </g>
</svg>
