<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 80 360 360" class="rose" role="img" aria-labelledby="roseTitle roseDesc">
  <title id="roseTitle">金蔷薇</title>
  <desc id="roseDesc">一朵俯视的金色蔷薇，花瓣以低饱和香槟金和柔和棕金层层旋开。</desc>
