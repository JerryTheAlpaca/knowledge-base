      <path d="M-31-70 C-20-78-9-80 1-74 C9-84 23-84 32-75 C38-69 40-62 38-54 C49-58 60-50 63-39" fill="none" stroke="url(#rimLight)" stroke-width="2.3" stroke-linecap="round"/>
