      <stop offset=".23" stop-color="#9e663a"/>
      <stop offset=".52" stop-color="#d9b27c"/>
      <stop offset=".78" stop-color="#f7e2ba"/>
      <stop offset="1" stop-color="#bf8950"/>
    </linearGradient>
    <linearGradient id="goldMidB" x1=".16" y1=".95" x2=".84" y2=".08">
      <stop offset="0" stop-color="#6d472e"/>
      <stop offset=".25" stop-color="#a97242"/>
      <stop offset=".5" stop-color="#e1bf8a"/>
      <stop offset=".75" stop-color="#f3dbad"/>
      <stop offset="1" stop-color="#b87f49"/>
    </linearGradient>
    <radialGradient id="goldInner" cx="36%" cy="22%" r="82%">
      <stop offset="0" stop-color="#f8e4bd"/>
      <stop offset=".27" stop-color="#d8ad73"/>
      <stop offset=".58" stop-color="#9d6338"/>
      <stop offset=".82" stop-color="#c79158"/>
      <stop offset="1" stop-color="#66412b"/>
    </radialGradient>
    <linearGradient id="goldCenter" x1=".28" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f1d7aa"/>
      <stop offset=".48" stop-color="#c59661"/>
      <stop offset="1" stop-color="#825336"/>
