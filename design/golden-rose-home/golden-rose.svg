        <use href="#innerPetalB" transform="rotate(52) scale(.98 1.06)"/>
        <use href="#innerPetalA" transform="rotate(104) scale(1.08 .98)"/>
        <use href="#innerPetalB" transform="rotate(156) scale(.96 1.08)"/>
        <use href="#innerPetalA" transform="rotate(208) scale(1.05 1.02)"/>
        <use href="#innerPetalB" transform="rotate(260) scale(1 1.07)"/>
        <use href="#innerPetalA" transform="rotate(312) scale(1.08 .96)"/>
      </g>
      <g transform="rotate(12) scale(.78)">
        <use href="#centerPetal" transform="rotate(0) scale(1 .95)"/>
        <use href="#centerPetal" transform="rotate(73) scale(.94 1.04)"/>
        <use href="#centerPetal" transform="rotate(145) scale(1.03 .96)"/>
        <use href="#centerPetal" transform="rotate(218) scale(.96 1.02)"/>
        <use href="#centerPetal" transform="rotate(290) scale(1.02 .94)"/>
