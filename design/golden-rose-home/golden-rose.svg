      <path d="M-55-92 C-43-105-29-111-16-105 C-8-119 8-123 21-115 C30-109 35-100 35-90 C49-97 65-89 72-75" fill="none" stroke="url(#rimLight)" stroke-width="2.7" stroke-linecap="round"/>
