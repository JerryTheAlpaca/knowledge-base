      <stop offset=".55" stop-color="#c99c62" stop-opacity=".07"/>
      <stop offset="1" stop-color="#a97942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldOuterA" x1=".72" y1=".96" x2=".22" y2=".02">
      <stop offset="0" stop-color="#765035"/>
      <stop offset=".22" stop-color="#ad7848"/>
      <stop offset=".5" stop-color="#d6ae78"/>
      <stop offset=".77" stop-color="#f1d8aa"/>
      <stop offset="1" stop-color="#c89559"/>
