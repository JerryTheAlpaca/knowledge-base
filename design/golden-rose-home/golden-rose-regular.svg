<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 80 360 360" class="rose" role="img" aria-labelledby="regularRoseTitle regularRoseDesc">
  <title id="regularRoseTitle">规律排列的金蔷薇</title>
  <desc id="regularRoseDesc">一朵由同形花瓣按等角度和固定比例逐层排列的低饱和金色蔷薇。</desc>
  <defs>
    <radialGradient id="regularGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e5c289" stop-opacity=".16"/>
      <stop offset=".58" stop-color="#c99c62" stop-opacity=".06"/>
      <stop offset="1" stop-color="#a97942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="regularGold" x1=".2" y1="0" x2=".76" y2="1">
      <stop offset="0" stop-color="#f3ddb5"/>
      <stop offset=".28" stop-color="#dfbd88"/>
      <stop offset=".58" stop-color="#bd8954"/>
      <stop offset=".82" stop-color="#93613b"/>
      <stop offset="1" stop-color="#714831"/>
    </linearGradient>
    <linearGradient id="regularRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1d1" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff0cf" stop-opacity=".82"/>
      <stop offset="1" stop-color="#b27d49" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="regularSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff5df" stop-opacity=".02"/>
      <stop offset=".5" stop-color="#fff8e9" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#fff5df" stop-opacity=".02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="regularShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2b190e" flood-opacity=".24"/>
    </filter>
    <clipPath id="regularBloomClip"><circle cx="300" cy="260" r="166"/></clipPath>
    <g id="regularPetal">
      <path d="M0 6 C-22 6-38-8-42-27 C-48-55-39-84-21-104 C-10-116 10-116 21-104 C39-84 48-55 42-27 C38-8 22 6 0 6Z" fill="url(#regularGold)" stroke="#8b5b39" stroke-opacity=".5" stroke-width="1.35"/>
      <path d="M-21-104 C-10-116 10-116 21-104" fill="none" stroke="url(#regularRim)" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <g id="centerBlade">
      <path d="M0 1 C-7-5-10-15-6-24 C-3-31 3-34 7-29 C13-23 14-14 10-7 C8-3 4 0 0 1Z" fill="#bd8a56" stroke="#805234" stroke-opacity=".45" stroke-width=".9"/>
      <path d="M-5-23 C-2-29 3-32 7-28" fill="none" stroke="#ecd0a0" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    .sheenRect { transform: translateX(-700px); }
    .play .plant { transform-box: view-box; transform-origin: 50% 50%; animation: swayOnce 2s ease-in-out 1 both; }
    @keyframes swayOnce { 0% { transform: rotate(0); } 32% { transform: rotate(-1.5deg); } 68% { transform: rotate(1deg); } 100% { transform: rotate(0); } }
    .play .sheenRect { animation: sheenOnce 1.5s ease-in-out .18s 1 both; }
    @keyframes sheenOnce { from { transform: translateX(-700px); } to { transform: translateX(700px); } }
    .play .glowPulse { transform-box: fill-box; transform-origin: center; animation: glowOnce 1.8s ease-in-out 1 both; }
    @keyframes glowOnce { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <circle class="glowPulse" cx="300" cy="260" r="172" fill="url(#regularGlow)"/>
  <g class="plant" filter="url(#regularShadow)" transform="translate(300 260)">
    <g>
      <use href="#regularPetal" transform="rotate(0) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(30) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(60) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(90) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(120) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(150) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(180) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(210) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(240) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(270) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(300) scale(1.05)"/>
      <use href="#regularPetal" transform="rotate(330) scale(1.05)"/>
    </g>
    <g transform="rotate(15) scale(.84)">
      <use href="#regularPetal" transform="rotate(0)"/><use href="#regularPetal" transform="rotate(36)"/>
      <use href="#regularPetal" transform="rotate(72)"/><use href="#regularPetal" transform="rotate(108)"/>
      <use href="#regularPetal" transform="rotate(144)"/><use href="#regularPetal" transform="rotate(180)"/>
      <use href="#regularPetal" transform="rotate(216)"/><use href="#regularPetal" transform="rotate(252)"/>
      <use href="#regularPetal" transform="rotate(288)"/><use href="#regularPetal" transform="rotate(324)"/>
    </g>
    <g transform="rotate(7.5) scale(.67)">
      <use href="#regularPetal" transform="rotate(0)"/><use href="#regularPetal" transform="rotate(45)"/>
      <use href="#regularPetal" transform="rotate(90)"/><use href="#regularPetal" transform="rotate(135)"/>
      <use href="#regularPetal" transform="rotate(180)"/><use href="#regularPetal" transform="rotate(225)"/>
      <use href="#regularPetal" transform="rotate(270)"/><use href="#regularPetal" transform="rotate(315)"/>
    </g>
    <g transform="rotate(30) scale(.53)">
      <use href="#regularPetal" transform="rotate(0)"/><use href="#regularPetal" transform="rotate(60)"/>
      <use href="#regularPetal" transform="rotate(120)"/><use href="#regularPetal" transform="rotate(180)"/>
      <use href="#regularPetal" transform="rotate(240)"/><use href="#regularPetal" transform="rotate(300)"/>
    </g>
    <g transform="rotate(8)">
      <use href="#centerBlade" transform="rotate(0)"/><use href="#centerBlade" transform="rotate(72)"/>
      <use href="#centerBlade" transform="rotate(144)"/><use href="#centerBlade" transform="rotate(216)"/>
      <use href="#centerBlade" transform="rotate(288)"/>
    </g>
  </g>
  <g clip-path="url(#regularBloomClip)"><g transform="rotate(18 300 260)"><rect class="sheenRect" x="244" y="94" width="112" height="332" fill="url(#regularSheen)"/></g></g>
</svg>
