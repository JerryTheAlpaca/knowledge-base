# 单机部署结构（docs/02 §15.1）：api + worker（同代码镜像的独立任务入口）+ 反向代理占位。
# 数据库与对象卷挂载到当前主机磁盘，不放容器可写层；不向 API 暴露 Docker socket。
services:
  api:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/db/app.db
      OBJECTS_DIR: /data/objects
      TMP_DIR: /data/tmp
      DELETIONS_DIR: /data/deletions
      MASTER_KEY_FILE: /run/secrets/master_key
      MASTER_KEY_VERSION: "1"
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # 对外基础 URL：HTTPS 反代（宿主机 Caddy）后作为 Origin 校验基准并启用 Secure Cookie
      PUBLIC_BASE_URL: https://kb.jerrythealpaca.cn
      # 中心认证（统一登录，docs/05 §4.1）：与 Ledger 生产 SESSION_COOKIE_NAME/COOKIE_DOMAIN
      # 保持一致；KB Origin 需在 Ledger 的 ALLOWED_ORIGINS 与 ALLOWED_RETURN_TO 白名单内
      AUTH_SESSION_URL: https://auth.jerrythealpaca.cn/api/auth/session
      AUTH_LOGIN_URL: https://auth.jerrythealpaca.cn/login
      AUTH_LOGOUT_URL: https://auth.jerrythealpaca.cn/api/auth/logout
      AUTH_COOKIE_NAME: __Secure-jerry_session
      AUTH_COOKIE_DOMAIN: jerrythealpaca.cn
      AUTH_FORWARD_ORIGIN: https://kb.jerrythealpaca.cn
      PYTHONUNBUFFERED: "1"
    volumes:
      # 单一卷挂 /data（docs/02 §15.1）：db/objects/tmp/deletions 是同一持久化区的子目录。
      # 代码依赖 tmp → objects 同卷 rename 的原子性（docs/02 §7.4），拆成多个卷会因
      # 跨设备 rename 报 EXDEV (Invalid cross-device link)，导致存储探针和上传全部失败。
      - data:/data
    secrets:
      - master_key
      - session_secret
    # 8000 仅绑回环：公网流量统一走宿主机 Caddy（80/443 -> 127.0.0.1:8000）
    ports:
      - "127.0.0.1:8000:8000"
    # 初始内存上限 256MiB（docs/02 §14.1）；2GB 主机预留系统与 SQLite 页面缓存
    # memswap_limit=mem_limit：禁止 swap 超出物理内存评估（docs/11 §3.1）
    mem_limit: 256m
    memswap_limit: 256m

  worker:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "kbserver.workers.worker"]
    environment:
      DATABASE_URL: sqlite:////data/db/app.db
      OBJECTS_DIR: /data/objects
      TMP_DIR: /data/tmp
      DELETIONS_DIR: /data/deletions
      MASTER_KEY_FILE: /run/secrets/master_key
      MASTER_KEY_VERSION: "1"
      WORKER_POLL_SECONDS: "2"
      PYTHONUNBUFFERED: "1"
      # 本地 ASR（docs/11 §9.3）：引擎与模型已部署（制品 SHA-256 见 /opt/models/MANIFEST-sha256.txt）
      ASR_ENABLED: "true"
      ASR_MODEL: "sense_voice"
      ASR_MODEL_DIR: /opt/models
      ASR_ENGINE_BIN: /opt/sherpa/bin/sherpa-onnx-offline
      # 引擎为动态链接（sherpa-onnx v1.13.7 linux-x64 shared-no-tts），运行时库在同包 lib/ 下
      LD_LIBRARY_PATH: /opt/sherpa/lib
      ASR_IDLE_CPU_START: "0.25"
      ASR_IDLE_CPU_STOP: "0.70"
      # 宿主机 2GB 实测 MemAvailable 常态约 700MiB；按 docs/11 §9.3 的 800 会让自动转写永远排队
      ASR_IDLE_MIN_AVAILABLE_MIB: "512"
    volumes:
      # 单一卷挂 /data（docs/02 §15.1）：db/objects/tmp/deletions 是同一持久化区的子目录。
      # 代码依赖 tmp → objects 同卷 rename 的原子性（docs/02 §7.4），拆成多个卷会因
      # 跨设备 rename 报 EXDEV (Invalid cross-device link)，导致存储探针和上传全部失败。
      - data:/data
      # ASR 模型与引擎只读挂载（docs/11 §9.3）：部署时放置于宿主机 /opt/models 与 /opt/sherpa
      - /opt/models:/opt/models:ro
      - /opt/sherpa:/opt/sherpa:ro
    secrets:
      - master_key
      - session_secret
    # Worker 与全部子进程（FFmpeg/ASR）合计 640MiB（docs/11 §3.1）；
    # cpus 0.75 为初始配额，待业务负载实测调整
    mem_limit: 640m
    memswap_limit: 640m
    cpus: "0.75"

  # HTTPS 反代：宿主机 systemd Caddy（/etc/caddy/Caddyfile，多站点共享），
  # kb.jerrythealpaca.cn 片段见 deploy/Caddyfile——部署时追加到宿主机 Caddyfile 后 reload。
  # 不用容器 Caddy：宿主机实例已在服务其他站点，避免抢 80/443。

volumes:
  data:

secrets:
  master_key:
    file: ./secrets/master_key
  session_secret:
    file: ./secrets/session_secret
