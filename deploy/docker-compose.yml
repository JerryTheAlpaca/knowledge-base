# 单机部署结构（docs/02 §15.1）：api + worker（同代码镜像的独立任务入口）+ 反向代理占位。
# 数据库与对象卷挂载到当前主机磁盘，不放容器可写层；不向 API 暴露 Docker socket。
services:
  api:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/db/app.db
      OBJECTS_DIR: /data/objects
      TMP_DIR: /data/tmp
      DELETIONS_DIR: /data/deletions
      MASTER_KEY_FILE: /run/secrets/master_key
      MASTER_KEY_VERSION: "1"
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # 对外基础 URL：HTTPS 反代（宿主机 Caddy）后作为 Origin 校验基准并启用 Secure Cookie
      PUBLIC_BASE_URL: https://kb.jerrythealpaca.cn
      PYTHONUNBUFFERED: "1"
    volumes:
      # 单一卷挂 /data（docs/02 §15.1）：db/objects/tmp/deletions 是同一持久化区的子目录。
      # 代码依赖 tmp → objects 同卷 rename 的原子性（docs/02 §7.4），拆成多个卷会因
      # 跨设备 rename 报 EXDEV (Invalid cross-device link)，导致存储探针和上传全部失败。
      - data:/data
    secrets:
      - master_key
      - session_secret
    # 8000 仅绑回环：公网流量统一走宿主机 Caddy（80/443 -> 127.0.0.1:8000）
    ports:
      - "127.0.0.1:8000:8000"
    # 初始内存上限 256MiB（docs/02 §14.1）；2GB 主机预留系统与 SQLite 页面缓存
    mem_limit: 256m

  worker:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "kbserver.workers.worker"]
    environment:
      DATABASE_URL: sqlite:////data/db/app.db
      OBJECTS_DIR: /data/objects
      TMP_DIR: /data/tmp
      DELETIONS_DIR: /data/deletions
      MASTER_KEY_FILE: /run/secrets/master_key
      MASTER_KEY_VERSION: "1"
      WORKER_POLL_SECONDS: "2"
      PYTHONUNBUFFERED: "1"
    volumes:
      # 单一卷挂 /data（docs/02 §15.1）：db/objects/tmp/deletions 是同一持久化区的子目录。
      # 代码依赖 tmp → objects 同卷 rename 的原子性（docs/02 §7.4），拆成多个卷会因
      # 跨设备 rename 报 EXDEV (Invalid cross-device link)，导致存储探针和上传全部失败。
      - data:/data
    secrets:
      - master_key
      - session_secret
    # Worker 内存上限 640MiB
    mem_limit: 640m

  # HTTPS 反代：宿主机 systemd Caddy（/etc/caddy/Caddyfile，多站点共享），
  # kb.jerrythealpaca.cn 片段见 deploy/Caddyfile——部署时追加到宿主机 Caddyfile 后 reload。
  # 不用容器 Caddy：宿主机实例已在服务其他站点，避免抢 80/443。

volumes:
  data:

secrets:
  master_key:
    file: ./secrets/master_key
  session_secret:
    file: ./secrets/session_secret
